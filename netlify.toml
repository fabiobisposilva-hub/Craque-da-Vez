[build]
  command = "npm run build"
  publish = "dist"

# App de página única: toda rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker e o manifesto sempre na versão mais nova
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
